<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Archivo:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #9a3412; }
    a:hover { color: #7c2d12; }
  </style>
</helmet>
<div style="width: 880px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 44px 56px 48px 56px; background: #faf7f1; color: #211d19; font-family: Archivo, Helvetica, Arial, sans-serif;">
  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;">Plain Advice</div>
    <div style="font-size: 13px; letter-spacing: 0.08em; color: #8a8178;">No. {{num}} of {{count}}</div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 28px; max-width: 660px;">
    <div style="width: 48px; height: 2px; background: {{accent}};"></div>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 44px; line-height: 1.3; letter-spacing: -0.01em;">{{advice}}</div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <button onClick="{{ next }}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 12px 26px; background: none; border: 1.5px solid #211d19; border-radius: 999px; font-family: Archivo, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; color: #211d19; cursor: pointer;">
      <span>Another piece of advice</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <div style="font-size: 13px; color: #8a8178;">Free, forever. Take what helps.</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#9a3412","options":["#9a3412","#1e40af","#166534","#6d28d9"],"section":"Theme"},"$preview":{"width":880,"height":600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const list = [
      "If it takes less than two minutes, do it now.",
      "Sleep on big decisions. Act fast on small ones.",
      "You don't have to attend every argument you're invited to.",
      "Write it down. Your memory is a liar with good intentions.",
      "Comparison is a tax you don't have to pay.",
      "Ask the question. Everyone else is wondering too."
    ];
    const i = this.state.i % list.length;
    return {
      advice: list[i],
      num: i + 1,
      count: list.length,
      next: () => this.setState({ i: (i + 1) % list.length }),
      accent: this.props.accent ?? '#9a3412'
    };
  }
}
</script>
</body>
</html>
